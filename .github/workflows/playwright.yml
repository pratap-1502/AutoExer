name: Playwright checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  smoke:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    env:
      TEST_ENV: qa
      BASE_URL: https://automationexercise.com
      HEADLESS: true
      WORKERS: 2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium and OS dependencies
        run: npx playwright install --with-deps chromium
      - name: Type check
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Run Chromium smoke tests
        run: npm run test:smoke -- --project=chromium --workers=2
      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
      - name: Upload test artifacts
        uses: actions/upload-artifact@v4
        if: ${{ failure() }}
        with:
          name: test-results
          path: test-results/
          retention-days: 14
